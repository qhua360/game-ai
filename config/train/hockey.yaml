# JEPA World Model training config for ice hockey
# Matches LeWorldModel (le-wm) config pattern

# Encoder (ViT via stable-pretraining)
encoder_scale: tiny
encoder:
  patch_size: 14
  image_size: 84

# Predictor (AR Transformer with AdaLN)
predictor:
  depth: 6
  heads: 16
  dim_head: 12
  mlp_dim: 2048
  dropout: 0.1

# Loss
loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

# World model
wm:
  history_size: 3
  num_preds: 1

# Data
data:
  seq_len: 4     # history_size + num_preds
  frameskip: 3   # sample every 3rd frame (60fps → ~20fps effective)

# Data loader
loader:
  batch_size: 128
  shuffle: true
  drop_last: true
  num_workers: 4
  persistent_workers: true
  pin_memory: true

# Optimizer
optimizer:
  _target_: torch.optim.AdamW
  lr: 5e-5
  weight_decay: 1e-3

# Training
max_epochs: 100
gradient_clip_val: 1.0
# precision: auto-detected at runtime (bf16-mixed on CUDA, 32-true on MPS)

# Actions
num_actions: 12    # per player
num_players: 6     # 3 per team, 2 teams
