[project]
name = "jepa-game-ai"
version = "0.1.0"
description = "JEPA-powered video game AI — starting with ice hockey"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.5",
    "torch>=2.0",
    "gymnasium>=0.29",
    "numpy>=1.24",
    "h5py>=3.9",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
