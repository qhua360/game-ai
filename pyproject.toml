[project]
name = "jepa-game-ai"
version = "0.1.0"
description = "JEPA-powered video game AI — starting with ice hockey"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.5",
    "torch>=2.0",
    "gymnasium>=0.29",
    "numpy>=1.24",
    "h5py>=3.9",
    "matplotlib>=3.7",
    "stable-worldmodel>=0.0.6",
    "lightning>=2.6.1",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]
